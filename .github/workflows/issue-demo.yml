name: Issue Demo

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to comment on"
        required: true
        type: string
      issue_body:
        description: "Issue body to pass to opencode run"
        required: true
        type: string
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  demo:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'issues' || github.event.issue.pull_request == null }}
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      ISSUE_BODY: ${{ github.event.issue.body || inputs.issue_body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build devbox container
        run: docker compose build devbox

      - name: Verify OpenCode CLI in container
        run: docker compose run --rm devbox bash -lc 'opencode --version'

      - name: Generate OpenCode response from issue body
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          mkdir -p .tmp
          printf '%s\n' "$ISSUE_BODY" > .tmp/issue-body.txt

          if [ ! -s .tmp/issue-body.txt ]; then
            printf '%s\n' 'No issue description provided. Please summarize this issue and propose next steps.' > .tmp/issue-body.txt
          fi

          if [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${OPENCODE_API_KEY:-}" ]; then
            {
              printf '%s\n\n' 'No model provider credentials are configured for this repository.'
              printf '%s\n' 'Set at least one secret (`OPENAI_API_KEY`, `ANTHROPIC_API_KEY`, or `OPENCODE_API_KEY`) and rerun the workflow.'
            } > .tmp/opencode-response.txt
            exit 0
          fi

          set +e
          timeout 180s docker compose run --rm \
            -e OPENAI_API_KEY \
            -e ANTHROPIC_API_KEY \
            -e OPENCODE_API_KEY \
            devbox \
            bash -lc 'ISSUE_DESC="$(cat /workspace/.tmp/issue-body.txt)" && opencode run "$ISSUE_DESC"' \
            > .tmp/opencode-response.txt 2>&1
          exit_code=$?
          set -e

          if [ "$exit_code" -ne 0 ]; then
            cp .tmp/opencode-response.txt .tmp/opencode-error.txt

            if [ "$exit_code" -eq 124 ]; then
              {
                printf '%s\n\n' 'OpenCode invocation timed out after 180 seconds.'
                printf '%s\n\n' 'Confirm model provider credentials are valid and that `opencode run` can complete non-interactively in the container.'
                printf '%s\n' 'Workflow captured logs:'
                cat .tmp/opencode-error.txt
              } > .tmp/opencode-response.txt
            else
              {
                printf '%s\n\n' "OpenCode invocation failed with exit code ${exit_code}."
                printf '%s\n' 'Workflow captured logs:'
                cat .tmp/opencode-error.txt
              } > .tmp/opencode-response.txt
            fi
          fi

      - name: Post OpenCode response
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        with:
          script: |
            const fs = require('node:fs');
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            let response = '';
            try {
              response = fs.readFileSync('.tmp/opencode-response.txt', 'utf8').trim();
            } catch {
              response = 'No response file was generated by the workflow.';
            }

            if (!response) {
              response = 'OpenCode returned an empty response.';
            }

            response = response
              .replace(/[\u001B\u009B][[\]()#;?]*(?:(?:[a-zA-Z\d]*(?:;[a-zA-Z\d]*)*)?\u0007|(?:\d{1,4}(?:;\d{0,4})*)?[\dA-PR-TZcf-nq-uy=><~])/g, '')
              .replace(/\r/g, '')
              .trim();

            const maxChars = 60000;
            const safeResponse = response.length > maxChars
              ? `${response.slice(0, maxChars)}\n\n...[truncated]`
              : response;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                `OpenCode demo response for #${issueNumber}:`,
                '',
                '```text',
                safeResponse,
                '```'
              ].join('\n')
            });
