name: Issue Stage - Develop Kickoff

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to bootstrap into Develop stage"
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  kickoff:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.pull_request == null && github.event.label.name == 'Develop') }}
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create kickoff plan document
        id: kickoff
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const safeSlug = (issue.title || 'work')
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 32) || 'work';

            const branchName = `vfp/agent/issue-${issueNumber}-${safeSlug}`;
            const planPath = `docs/plans/issue-${issueNumber}-develop.plan.md`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const highlights = comments
              .filter((comment) => comment.body && comment.body.trim())
              .slice(-10)
              .map((comment) => {
                const condensed = comment.body.replace(/\s+/g, ' ').trim();
                const snippet = condensed.length > 220 ? `${condensed.slice(0, 220)}...` : condensed;
                return `- @${comment.user.login}: ${snippet}`;
              });

            const content = [
              `# Issue #${issueNumber} Develop Kickoff Plan`,
              '',
              '## Objective',
              issue.title || 'No title provided.',
              '',
              '## Source Issue',
              `- URL: ${issue.html_url}`,
              '- Stage: Develop',
              '- Generated by workflow: `issue-stage-develop.yml`',
              '',
              '## Problem Statement',
              (issue.body || 'No issue description provided.').trim(),
              '',
              '## Thread Highlights',
              highlights.length > 0 ? highlights.join('\n') : '- No thread comments yet.',
              '',
              '## Kickoff Tasks',
              '- Confirm implementation scope from issue body and thread highlights.',
              '- Add/adjust implementation commits on the linked PR branch.',
              '- Update this plan as the implementation details become concrete.',
              '',
              '## Verification Targets',
              '- Workflow and automation changes are validated via `gh run` evidence.',
              '- Documentation reflects any new stage triggers or commands.',
            ].join('\n');

            fs.mkdirSync(path.dirname(planPath), { recursive: true });
            fs.writeFileSync(planPath, `${content}\n`, 'utf8');

            core.setOutput('branch_name', branchName);
            core.setOutput('plan_path', planPath);
            core.setOutput('issue_title', issue.title || `Issue ${issueNumber}`);

      - name: Check for existing kickoff PR
        id: existing
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.kickoff.outputs.branch_name }}
        with:
          script: |
            const branch = process.env.BRANCH_NAME;
            const head = `${context.repo.owner}:${branch}`;

            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head,
              per_page: 10,
            });

            if (pulls.length > 0) {
              core.setOutput('exists', 'true');
              core.setOutput('pr_url', pulls[0].html_url);
              core.setOutput('pr_number', String(pulls[0].number));
            } else {
              core.setOutput('exists', 'false');
            }

      - name: Configure git author
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit kickoff plan and push branch
        if: ${{ steps.existing.outputs.exists != 'true' }}
        id: commit_plan
        env:
          BRANCH_NAME: ${{ steps.kickoff.outputs.branch_name }}
          PLAN_PATH: ${{ steps.kickoff.outputs.plan_path }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
        run: |
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            git fetch origin "$BRANCH_NAME:$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
          else
            git checkout -b "$BRANCH_NAME"
          fi

          git add "$PLAN_PATH"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No kickoff plan changes detected"
            echo "ready_for_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "[${ISSUE_NUMBER}] {System} // Add develop-stage kickoff plan (Tags: AUTO, PLAN)"
          git push -u origin "$BRANCH_NAME"
          echo "ready_for_pr=true" >> "$GITHUB_OUTPUT"

      - name: Open draft kickoff PR
        if: ${{ steps.existing.outputs.exists != 'true' && steps.commit_plan.outputs.ready_for_pr == 'true' }}
        id: create_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTOMATION_PAT || github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const branch = process.env.BRANCH_NAME;
            const planPath = process.env.PLAN_PATH;
            const issueTitle = process.env.ISSUE_TITLE;

            const body = [
              '## Summary',
              `- bootstraps Develop stage for #${issueNumber}`,
              `- adds kickoff plan document at \`${planPath}\``,
              '- prepares branch for implementation-stage automation',
              '',
              '## Next Actions',
              '- refine plan details as code changes are implemented',
              '- trigger PR implementation workflow with `/agent-implement <task>` on this PR',
              '',
              `Refs #${issueNumber}`,
            ].join('\n');

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[${issueNumber}] Develop Kickoff // ${issueTitle}`,
                head: branch,
                base: 'main',
                body,
                draft: true,
              });

              core.setOutput('created', 'true');
              core.setOutput('pr_url', pr.html_url);
              core.setOutput('pr_number', String(pr.number));
            } catch (error) {
              core.setOutput('created', 'false');
              core.setOutput('pr_error', error.message || 'Unknown pull request creation error');
            }
        env:
          BRANCH_NAME: ${{ steps.kickoff.outputs.branch_name }}
          PLAN_PATH: ${{ steps.kickoff.outputs.plan_path }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          ISSUE_TITLE: ${{ steps.kickoff.outputs.issue_title }}

      - name: Post kickoff status on issue
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          PLAN_PATH: ${{ steps.kickoff.outputs.plan_path }}
          BRANCH_NAME: ${{ steps.kickoff.outputs.branch_name }}
          EXISTING: ${{ steps.existing.outputs.exists }}
          READY_FOR_PR: ${{ steps.commit_plan.outputs.ready_for_pr }}
          PR_CREATED: ${{ steps.create_pr.outputs.created }}
          PR_ERROR: ${{ steps.create_pr.outputs.pr_error }}
          EXISTING_PR_URL: ${{ steps.existing.outputs.pr_url }}
          NEW_PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const exists = process.env.EXISTING === 'true';
            const readyForPr = process.env.READY_FOR_PR === 'true';
            const prCreated = process.env.PR_CREATED === 'true';
            const planPath = process.env.PLAN_PATH;
            const branchName = process.env.BRANCH_NAME;
            const prError = process.env.PR_ERROR || 'No error details were captured.';
            const prUrl = exists ? process.env.EXISTING_PR_URL : process.env.NEW_PR_URL;

            const body = exists
              ? [
                  '### Develop Kickoff',
                  `A kickoff PR already exists for this stage: ${prUrl}`,
                  `Plan document: \`${planPath}\``,
                ].join('\n')
              : !readyForPr
              ? [
                  '### Develop Kickoff',
                  `Plan document is already up to date: \`${planPath}\``,
                  'No new kickoff PR was created because this run produced no diff.',
                ].join('\n')
              : !prCreated
              ? [
                  '### Develop Kickoff',
                  `Kickoff branch prepared: \`${branchName}\``,
                  `Plan document: \`${planPath}\``,
                  'Automatic PR creation was blocked by repository policy or token scope.',
                  `Error: ${prError}`,
                  '',
                  'Create the draft PR manually with:',
                  `\`gh pr create --head ${branchName} --base main --title "[${issueNumber}] Develop Kickoff // <title>" --body "Refs #${issueNumber}" --draft\``,
                ].join('\n')
              : [
                  '### Develop Kickoff',
                  `Created kickoff plan document: \`${planPath}\``,
                  `Opened draft PR: ${prUrl}`,
                  '',
                  'To request implementation commits on that PR, comment:',
                  '`/agent-implement <task>`',
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
